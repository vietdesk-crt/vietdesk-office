<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="vCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E4D"/>
      <stop offset="50%" stop-color="#DA251D"/>
      <stop offset="100%" stop-color="#990B13"/>
    </linearGradient>

    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="40%" stop-color="#FFC700"/>
      <stop offset="100%" stop-color="#E58900"/>
    </linearGradient>

    <linearGradient id="vVermilion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C38"/>
      <stop offset="100%" stop-color="#C21A1A"/>
    </linearGradient>

    <filter id="symShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8B0000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="vietdesk-symbol" filter="url(#symShadow)">
    <!-- Right Wing - Document Sheet 2 (Back gold flutter) -->
    <path d="M256 425 C295 350 365 240 435 155 C450 137 435 125 415 138 C355 178 290 280 256 385 Z"
          fill="url(#vGold)" opacity="0.65" />

    <!-- Right Wing - Document Sheet 1 / Wing feather (Mid gold-amber) -->
    <path d="M256 425 C285 345 350 215 410 120 C420 104 402 98 385 112 C330 160 275 270 256 395 Z"
          fill="url(#vGold)" />

    <!-- Left Wing - Lac Bird Soaring Neck / Main Stem of 'V' (Crimson) -->
    <path d="M256 430 C225 365 160 230 102 142 C82 112 60 85 82 82 C105 79 135 110 175 165 C222 230 256 335 256 430 Z"
          fill="url(#vVermilion)" />

    <path d="M256 430 C228 350 168 215 115 130 C96 100 80 84 94 80 C110 76 135 102 178 158 C225 220 252 320 256 430 Z"
          fill="url(#vCrimson)" />

    <!-- Lac Bird Crown Crest / Top Finial (Gold) -->
    <path d="M80 82 C98 68 135 62 172 70 C140 85 116 112 102 142 C92 118 84 98 80 82 Z"
          fill="url(#vGold)" />

    <!-- The Golden Star of Vietnam (Trí tuệ & Tinh thần phụng sự) -->
    <g transform="translate(325, 95) scale(0.95)">
      <!-- 5-Pointed Star -->
      <polygon points="0,-38 11.2,-11.6 36.1,-11.6 16,-3 23.6,24.8 0,8 -23.6,24.8 -16,-3 -36.1,-11.6 -11.2,-11.6"
               fill="url(#vGold)" />
      <!-- Star Facets -->
      <polygon points="0,-38 0,8 23.6,24.8" fill="#FFF9C4" opacity="0.4" />
      <polygon points="0,-38 0,8 -23.6,24.8" fill="#B45309" opacity="0.25" />
    </g>

    <!-- Center Fold Crease (Document/Desk line) -->
    <path d="M256 430 L256 350" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  </g>
</svg>
