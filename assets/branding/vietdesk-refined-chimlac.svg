<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm Lacquer Cinnabar Palette (Đỏ Son Mài Truyền Thống - Trầm ấm, dịu mắt) -->
    <linearGradient id="lacquerRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C73E3A"/>
      <stop offset="60%" stop-color="#A82824"/>
      <stop offset="100%" stop-color="#7D1A18"/>
    </linearGradient>

    <!-- Antique Muted Gold (Vàng Quỳ / Thếp Vàng Sơn Mài - Tinh tế, không chói) -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C779"/>
      <stop offset="50%" stop-color="#DEA54B"/>
      <stop offset="100%" stop-color="#B87D28"/>
    </linearGradient>

    <!-- Warm Amber Bridge Gradient (Giao thoa mềm giữa đỏ son và vàng đồng) -->
    <linearGradient id="warmBridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D45B43"/>
      <stop offset="100%" stop-color="#DEA54B"/>
    </linearGradient>

    <!-- Soft Ambient Warm Background -->
    <linearGradient id="bgWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1F"/>
      <stop offset="100%" stop-color="#181314"/>
    </linearGradient>

    <!-- Natural Soft Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle: Dáng bo mềm mại, viền vàng đồng siêu mảnh -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#bgWarm)"/>
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="url(#antiqueGold)" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Biểu Tượng Dải Lụa Sơn Mài Liền Mạch (Continuous Flow) -->
  <g filter="url(#softGlow)" transform="translate(0, 8)">
    
    <!-- Lớp Cánh Phía Sau - Trang giấy văn phòng / Dải cánh phụ (Vàng đồng trầm) -->
    <path d="M256 395 C286 335 340 245 405 168 C416 155 406 142 390 150 C336 178 288 262 256 360 Z"
          fill="url(#antiqueGold)" opacity="0.6"/>

    <!-- Lớp Cánh Giữa - Chuyển sắc ấm dịu -->
    <path d="M256 405 C282 338 332 226 384 140 C392 127 378 120 366 130 C318 170 274 265 256 380 Z"
          fill="url(#warmBridge)" opacity="0.9"/>

    <!-- Thân Trái Chữ V - Dáng Chim Lạc Uốn Lượn Như Nét Bút Son (Mềm mại, liền khối) -->
    <path d="M256 415 C232 355 178 245 125 162 C108 135 95 110 110 102 C125 94 146 114 175 156 C216 215 245 320 256 415 Z"
          fill="url(#lacquerRed)"/>

    <!-- Mào Chim Lạc / Đỉnh Cánh Son Mài (Điểm nhấn vàng thếp nhẹ nhàng) -->
    <path d="M102 106 C118 96 142 92 165 96 C144 108 126 128 116 150 C108 132 103 118 102 106 Z"
          fill="url(#antiqueGold)" opacity="0.95"/>

    <!-- Cánh Phải Chính - Vươn Cao Thanh Thoát -->
    <path d="M256 415 C275 350 318 240 362 152 C342 208 304 295 272 372 C266 386 261 400 256 415 Z"
          fill="url(#antiqueGold)"/>

    <!-- Ngôi Sao Vàng Thếp - Tỷ lệ thanh nhã, ánh sáng dịu (Không chói lóa) -->
    <g transform="translate(320, 105) scale(0.85)">
      <polygon points="0,-32 9.5,-9.8 30.4,-9.8 13.5,2.4 20,25.8 0,11.3 -20,25.8 -13.5,2.4 -30.4,-9.8 -9.5,-9.8"
               fill="url(#antiqueGold)"/>
      <polygon points="0,-32 0,11.3 20,25.8" fill="#FFF2D1" opacity="0.3"/>
      <polygon points="0,-32 0,11.3 -20,25.8" fill="#8C5819" opacity="0.25"/>
    </g>

    <!-- Nét chạm nhẹ tinh tế ở chân chữ V -->
    <circle cx="256" cy="415" r="4" fill="#DEA54B" opacity="0.8"/>
  </g>
</svg>
