<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%">
  <defs>
    <!-- Red Gradient -->
    <linearGradient id="hzRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E4D"/>
      <stop offset="50%" stop-color="#DA251D"/>
      <stop offset="100%" stop-color="#A50E16"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="hzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF082"/>
      <stop offset="30%" stop-color="#FFD000"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="hzVermilion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C38"/>
      <stop offset="100%" stop-color="#C21A1A"/>
    </linearGradient>

    <filter id="hzShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B0000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Icon Mark (Scaled down from 512 to 130) -->
  <g transform="translate(18, 15) scale(0.25)" filter="url(#hzShadow)">
    <!-- Right Wing - Sheet 2 -->
    <path d="M256 425 C295 350 365 240 435 155 C450 137 435 125 415 138 C355 178 290 280 256 385 Z" fill="url(#hzGold)" opacity="0.7" />
    <!-- Right Wing - Sheet 1 -->
    <path d="M256 425 C285 345 350 215 410 120 C420 104 402 98 385 112 C330 160 275 270 256 395 Z" fill="url(#hzGold)" />
    <!-- Left Wing - Lac Bird Neck -->
    <path d="M256 430 C225 365 160 230 102 142 C82 112 60 85 82 82 C105 79 135 110 175 165 C222 230 256 335 256 430 Z" fill="url(#hzVermilion)" />
    <path d="M256 430 C228 350 168 215 115 130 C96 100 80 84 94 80 C110 76 135 102 178 158 C225 220 252 320 256 430 Z" fill="url(#hzRed)" />
    <!-- Lac Bird Crest -->
    <path d="M80 82 C98 68 135 62 172 70 C140 85 116 112 102 142 C92 118 84 98 80 82 Z" fill="url(#hzGold)" />
    <!-- Golden Star -->
    <g transform="translate(325, 95) scale(0.95)">
      <polygon points="0,-38 11.2,-11.6 36.1,-11.6 16,-3 23.6,24.8 0,8 -23.6,24.8 -16,-3 -36.1,-11.6 -11.2,-11.6" fill="url(#hzGold)" />
    </g>
  </g>

  <!-- Typography: VIETDESK -->
  <!-- "Viet" in Vietnamese Crimson Red -->
  <text x="160" y="94" font-family="'Be Vietnam Pro', 'Segoe UI', Inter, -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#hzRed)" letter-spacing="-1">Viet<tspan fill="#1E293B" font-weight="700">Desk</tspan></text>

  <!-- Product Tagline & Suite Indicators -->
  <text x="164" y="126" font-family="'Be Vietnam Pro', 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="700" fill="#64748B" letter-spacing="2.8">BỘ ỨNG DỤNG VĂN PHÒNG VIỆT</text>

  <!-- Three Apps Dot Badges (Writer: Red, Sheets: Green, Slides: Amber) -->
  <g transform="translate(560, 80)">
    <!-- Writer -->
    <circle cx="0" cy="0" r="6" fill="#DA251D"/>
    <!-- Sheets -->
    <circle cx="22" cy="0" r="6" fill="#10B981"/>
    <!-- Slides -->
    <circle cx="44" cy="0" r="6" fill="#F59E0B"/>
  </g>
  <text x="560" y="105" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="1">WRITER · SHEETS · SLIDES</text>
</svg>
