[package]
name = "vietdesk-desktop"
version = "0.1.0"
description = "VietDesk Office - vỏ desktop Tauri"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "vietdesk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vietdesk-core-bridge = { path = "../../native/core-bridge" }

[features]
# Feature mặc định để Tauri CLI nhận diện; không cần bật gì thêm.
default = []
